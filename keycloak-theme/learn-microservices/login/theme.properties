# Learn Microservices login theme.
# It extends the default Keycloak theme, so every page (login, reset password,
# one-time code, errors ...) keeps working. Only the look is changed.
parent=keycloak.v2

# "css/styles.css" is the default Keycloak file (tooltips, social buttons ...).
# "css/learn.css" is ours and is loaded after it, so ours wins.
styles=css/styles.css css/learn.css

# Text shown in the brand panel and the footer.
brandName=Learn Microservices
