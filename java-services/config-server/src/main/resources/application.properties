# ============================================================
# CONFIG SERVER
# What it does: keeps the settings (properties) of ALL other
# services in one place. Other services ask this server for
# their settings when they start, so they don't need to keep
# their own copy.
# ============================================================

# The name of this service. Other tools (logs, Eureka) use this name.
spring.application.name=config-server

# The port this server runs on.
# Other services call http://localhost:8888 to get their settings.
server.port=8888

# Where to read settings from.
# Option 1 (disabled): read from a Git repository. Uncomment and put your repo URL to use it.
#spring.cloud.config.server.git.uri=https://github.com//config-repo.git

# Option 2 (active): "native" means read settings from local files
# instead of Git. Good for learning and local development.
spring.profiles.active=native

# The folder (inside src/main/resources) that holds the settings files.
# File naming rule: <service-name>.properties
# Example: configurations/discovery-service.properties is sent to
# the service whose spring.application.name is "discovery-service".
spring.cloud.config.server.native.search-locations=classpath:/configurations
