# ============================================================
# SHARED SETTINGS FOR ALL SERVICES (served by the Config Server)
# The file name is "application.properties" on purpose.
# The Config Server sends these settings to EVERY service
# (customer-service, product-service, discovery-service ...).
# So we write common settings here only once.
#
# Rule: if a service has its own file (for example
# customer-service.properties) and it sets the same key,
# the service's own value wins over the value in this file.
# ============================================================

# The hostname a service uses when it tells Eureka "I am here".
# "localhost" = your own computer. Good for local development.
# When you use Docker later, change it to the real service name.
eureka.instance.hostname=localhost

# The address of the Eureka server (the phonebook of services).
# Every service uses this address to register itself and
# to find the other services.
# Format: http://<eureka-host>:<eureka-port>/eureka/
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Decides who wins when the same setting is found in two places:
# - false = settings given by the computer (system properties,
#           environment variables) win over the settings sent
#           by the Config Server.
# - true  = settings from the Config Server win.
# With "false" you can change a value on your computer without
# editing the Config Server files. Example: set DB_PASSWORD in
# your environment for a different database password.
spring.cloud.config.override-system-properties=false
