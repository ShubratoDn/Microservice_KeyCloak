# ============================================================
# SETTINGS FOR "discovery-service" (served by the Config Server)
# This file is NOT read directly by the discovery service.
# The Config Server sends it when discovery-service asks for its
# settings. The file name must match the service's
# spring.application.name.
# ============================================================

# The hostname that Eureka shows/uses for this service.
# Other services use this name to find the discovery service.
# "discovery-service" is a real name, so it also works in Docker.
# (A plain "localhost" would only work on your own computer.)
eureka.instance.hostname=discovery-service
