# ============================================================
# SETTINGS FOR "api-gateway" (served by the Config Server)
# This file is NOT read directly by the api gateway.
# The Config Server sends it when api-gateway asks for its
# settings. The file name must match the service's
# spring.application.name ("api-gateway").
# Shared settings (like the Eureka address) come from
# application.properties in this same folder.
# ============================================================

# The port this service runs on.
# This is the ONLY port the client needs to know:
# gateway = 8080, customer = 8081, product = 8082, order = 8083, user = 8084.
server.port=8080

# ------------------------------------------------------------
# ROUTES (the road map of the gateway)
# A route says: "if the URL looks like THIS, send the request
# to THAT service".
# Each route has 3 parts:
#   id         = a name for the route (any unique name, used in logs)
#   uri        = where to send the request.
#                "lb://customer-service" means: ask Eureka (the phonebook)
#                for the address of "customer-service" and share the
#                requests between all running copies (lb = load balancer).
#   predicates = the rule that decides if the route matches.
#                "Path=/api/v1/customers/**" means: any URL that starts
#                with /api/v1/customers (the ** means "and anything after it").
# The URL is sent to the service as it is, so
#   http://localhost:8080/api/v1/customers/1
# reaches customer-service as /api/v1/customers/1.
# ------------------------------------------------------------

# Route 1: everything about customers goes to customer-service.
spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/customers/**

# Route 2: products and categories both belong to product-service.
# Two paths in one predicate are separated by a comma.
spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/products/**,/api/v1/categories/**

# Route 3: everything about orders goes to order-service.
spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/orders/**

# Route 4: everything about users (registration, admin, manager, staff)
# goes to user-service.
spring.cloud.gateway.server.webmvc.routes[3].id=user-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/users/**
