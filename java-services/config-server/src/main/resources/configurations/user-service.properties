# ============================================================
# SETTINGS FOR "user-service" (served by the Config Server)
# This file is NOT read directly by the user service.
# The Config Server sends it when user-service asks for its
# settings. The file name must match the service's
# spring.application.name ("user-service").
# Shared settings (like the Eureka address and the Keycloak
# issuer-uri for checking tokens) come from
# application.properties in this same folder.
# ============================================================

# The port this service runs on.
# customer = 8081, product = 8082, order = 8083, user = 8084.
server.port=8084

# ------------------------------------------------------------
# DATABASE (PostgreSQL)
# Each service has its own database, so services do not
# share tables. Create this database first in psql:
#   CREATE DATABASE ms_user;
# ------------------------------------------------------------

# The address of the database.
# Format: jdbc:postgresql://<host>:<port>/<database-name>
spring.datasource.url=jdbc:postgresql://localhost:5432/ms_user

# The database user name and password.
# "${NAME:default}" means: use the computer setting called NAME
# if it exists, or else use the value after the colon.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# The driver is the small helper library that talks to PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# What Hibernate does with the tables when the service starts:
# - update = create missing tables and columns, keep old data
# - none   = do nothing (better for production)
spring.jpa.hibernate.ddl-auto=update

# Print every SQL command in the console. Helpful for learning.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
# KEYCLOAK ADMIN ACCESS
# When an admin registers a new user, this service must create
# the login account in Keycloak. For that it calls the Keycloak
# "Admin API". It logs in to Keycloak as itself, using a client
# called "user-service" (a "service account"), not as a person.
# Create the client first in Keycloak. The steps are in docs/user-registration.md.
# ------------------------------------------------------------

# The address of Keycloak.
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}

# The realm where the users are created.
keycloak.admin.realm=${KEYCLOAK_REALM:Learn_Microservices}

# The name of the client this service uses to log in to Keycloak.
keycloak.admin.client-id=user-service

# The secret (password) of that client.
# IMPORTANT: do NOT write the real secret in this file, because this
# file goes to Git. Set it on your computer instead (an environment
# variable), for example in PowerShell:
#   $env:KEYCLOAK_ADMIN_CLIENT_SECRET="the-secret-from-keycloak"
# You find it in Keycloak: Clients > user-service > Credentials.
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
