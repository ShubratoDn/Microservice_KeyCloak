# ============================================================
# SETTINGS FOR "customer-service" (served by the Config Server)
# This file is NOT read directly by the customer service.
# The Config Server sends it when customer-service asks for its
# settings. The file name must match the service's
# spring.application.name ("customer-service").
# Shared settings (like the Eureka address) come from
# application.properties in this same folder.
# ============================================================

# The port this service runs on.
# Every service needs its own port: customer = 8081, product = 8082.
server.port=8083

# ------------------------------------------------------------
# DATABASE (PostgreSQL)
# Each service has its own database, so services do not
# share tables. Create this database first in psql:
#   CREATE DATABASE ms_customer;
# ------------------------------------------------------------

# The address of the database.
# Format: jdbc:postgresql://<host>:<port>/<database-name>
# localhost = your own computer, 5432 = default PostgreSQL port,
# ms_customer = the database name.
spring.datasource.url=jdbc:postgresql://localhost:5432/ms_order

# The database user name and password.
# "${NAME:default}" means: use the computer setting called NAME
# if it exists, or else use the value after the colon.
# Change the defaults to match your own PostgreSQL user.
# Tip: for a real project, do not keep real passwords in files
# that go to Git. Set DB_USERNAME and DB_PASSWORD on the computer.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# The driver is the small helper library that talks to PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# What Hibernate (the tool that saves Java objects as table rows)
# does with the tables when the service starts:
# - update = create missing tables and columns, keep old data
#            (good for learning and local work)
# - none   = do nothing (better for production)
spring.jpa.hibernate.ddl-auto=update

# Print every SQL command in the console. Helpful for learning.
# Set to false if you want less output.
spring.jpa.show-sql=true

# Show the printed SQL in a neat, easy-to-read format.
spring.jpa.properties.hibernate.format_sql=true
