# ============================================================
# API GATEWAY
# What it does: it is the ONE front door for all microservices.
# The client (Postman, a website, a mobile app) only talks to the
# gateway. The gateway looks at the URL and sends the request to
# the right service (customer, product or order).
# This file is small on purpose. Most settings (port, routes,
# Eureka address) live in the Config Server:
#   config-server/src/main/resources/configurations/api-gateway.properties
# ============================================================

# The name of this service. Eureka uses it to list the service.
# The Config Server uses it to find the matching file
# (api-gateway.properties).
spring.application.name=api-gateway

# Load settings from the Config Server when this service starts.
# "optional:" means: if the Config Server is not running,
# the service still starts (but without those settings,
# so there will be no routes).
# Start the Config Server first (port 8888).
spring.config.import=optional:configserver:http://localhost:8888
