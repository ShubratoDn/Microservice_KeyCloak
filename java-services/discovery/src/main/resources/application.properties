# ============================================================
# DISCOVERY SERVICE (Eureka Server)
# What it does: works like a phonebook for microservices.
# Every service tells Eureka "I am here, at this address".
# When service A needs service B, it asks Eureka for B's address.
# ============================================================

# The name of this service. The Config Server uses it to find the
# matching file (configurations/discovery-service.properties).
spring.application.name=discovery-service

# Load settings from the Config Server when this service starts.
# "optional:" means: if the Config Server is not running,
# still start (using only the settings in this file).
# Start the Config Server first (port 8888) to get its settings.
spring.config.import=optional:configserver:http://localhost:8888

# The port Eureka runs on. Open http://localhost:8761 to see the dashboard.
server.port=8761

# This service IS the Eureka server, so it does not need to
# register itself as a client...
eureka.client.registerWithEureka=false
# ...and it does not need to download the list of services from itself.
# (Both are "false" for a single, standalone Eureka server.)
eureka.client.fetchRegistry=false

# The hostname Eureka uses for itself. "localhost" = your own computer.
# Note: the Config Server also sends this property (as "discovery-service").
# Config Server values normally win over this local value.
eureka.instance.hostname=localhost
