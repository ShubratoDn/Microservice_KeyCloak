# ============================================================
# CUSTOMER SERVICE
# What it does: handles customer data and saves it in a
# PostgreSQL database.
# This file is small on purpose. Most settings (port, database,
# Eureka address) live in the Config Server:
#   config-server/src/main/resources/configurations/customer-service.properties
# ============================================================

# The name of this service. Eureka uses it to list the service.
# The Config Server uses it to find the matching file
# (customer-service.properties).
spring.application.name=customer-service

# Load settings from the Config Server when this service starts.
# "optional:" means: if the Config Server is not running,
# the service still starts (but without those settings,
# so the database will not be configured).
# Start the Config Server first (port 8888).
spring.config.import=optional:configserver:http://localhost:8888
